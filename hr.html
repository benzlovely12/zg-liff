<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR — จัดการพนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --success: #16a34a;
      --success-light: #dcfce7;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --purple: #7c3aed;
      --purple-light: #ede9fe;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --sidebar-width: 260px;
      --header-height: 64px;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
    }
    html, body { height: 100%; font-family: 'Sarabun', sans-serif; font-size: 15px; color: var(--gray-800); background: var(--gray-100); }

    /* ===== LAYOUT — เหมือน app.html ===== */
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ===== SIDEBAR — copy จาก app.html ===== */
    .sidebar {
      position: relative; z-index: 1;
      width: var(--sidebar-width);
      background: var(--gray-900);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-logo h1 { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.3; }
    .sidebar-logo span { font-size: 12px; color: var(--gray-400); font-weight: 400; }

    .sidebar-section { padding: 12px 12px 4px; }
    .sidebar-section-title { font-size: 10px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .08em; padding: 0 8px 6px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      color: var(--gray-400); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .15s; margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-item.active { background: var(--primary); color: #fff; }
    .nav-item i { width: 18px; text-align: center; font-size: 14px; }

    /* ===== MAIN ===== */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: var(--header-height); background: #fff;
      border-bottom: 1px solid var(--gray-200);
      display: flex; align-items: center; padding: 0 24px;
      gap: 16px; flex-shrink: 0; box-shadow: var(--shadow);
    }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--gray-800); flex: 1; }
    .topbar-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; font-family: 'Sarabun', sans-serif;
      cursor: pointer; border: 1px solid var(--gray-200); background: #fff;
      color: var(--gray-600); transition: all .15s;
    }
    .topbar-back:hover { background: var(--gray-100); color: var(--gray-800); }

    .content-area { flex: 1; overflow-y: auto; padding: 24px; }

    /* ===== PAGES ===== */
    .page { display: none; }
    .page.active { display: block; }

    /* ===== TABLE CARD ===== */
    .table-card {
      background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-card-header {
      padding: 16px 20px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--gray-100);
    }
    .table-card-title { font-size: 16px; font-weight: 700; color: var(--gray-800); flex: 1; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      background: var(--gray-50); padding: 10px 14px;
      font-size: 12px; font-weight: 600; color: var(--gray-500);
      text-align: left; border-bottom: 1px solid var(--gray-200);
      white-space: nowrap;
    }
    .data-table td {
      padding: 12px 14px; border-bottom: 1px solid var(--gray-100);
      vertical-align: middle; font-size: 14px;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--gray-50); }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-active { background: var(--success-light); color: var(--success); }
    .badge-inactive { background: var(--danger-light); color: var(--danger); }

    .user-avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff; font-size: 13px; font-weight: 700;
      margin-right: 8px; flex-shrink: 0;
    }
    .user-name-cell { display: flex; align-items: center; }

    /* ===== EMPTY STATE ===== */
    .coming-soon {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 24px; gap: 16px; text-align: center;
    }
    .coming-soon-icon { font-size: 56px; color: var(--gray-200); }
    .coming-soon-title { font-size: 20px; font-weight: 700; color: var(--gray-400); }
    .coming-soon-sub { font-size: 14px; color: var(--gray-400); }

    /* ===== TOAST ===== */
    .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
      background: var(--gray-800); color: #fff; box-shadow: var(--shadow-md);
      display: flex; align-items: center; gap: 10px; animation: slideIn .2s ease;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR — เหมือน app.html ทุกอย่าง -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1><i class="fa-solid fa-car-wrench" style="color:#60a5fa;margin-right:8px;"></i>AutoRepair</h1>
      <span>ระบบจัดการอู่ซ่อมรถ</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">HR</div>
      <div class="nav-item active" id="nav-employees" onclick="showPage('employees')">
        <i class="fa-solid fa-id-card"></i> HR — จัดการพนักงาน
      </div>
      <div class="nav-item" id="nav-users" onclick="showPage('users')">
        <i class="fa-solid fa-users-gear"></i> ผู้ใช้งานระบบ
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:auto;">
      <div class="sidebar-section-title">ระบบ</div>
      <div class="nav-item" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">HR — จัดการพนักงาน</div>
    </div>

    <div class="content-area">

      <!-- PAGE: พนักงาน (ว่างไว้ก่อน) -->
      <div class="page active" id="page-employees">
        <div class="table-card">
          <div class="coming-soon">
            <div class="coming-soon-icon"><i class="fa-solid fa-id-card"></i></div>
            <div class="coming-soon-title">จัดการพนักงาน</div>
            <div class="coming-soon-sub">กำลังพัฒนา — จะเพิ่มข้อมูลพนักงานในเร็วๆ นี้</div>
          </div>
        </div>
      </div>

      <!-- PAGE: ผู้ใช้งานระบบ (read-only) -->
      <div class="page" id="page-users">
        <div class="table-card">
          <div class="table-card-header">
            <div class="table-card-title">
              <i class="fa-solid fa-users-gear" style="color:var(--primary);margin-right:8px;"></i>ผู้ใช้งานระบบ
            </div>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>ชื่อผู้ใช้งาน</th>
                <th>บทบาท</th>
                <th>สถานะ</th>
                <th><i class="fa-brands fa-line" style="color:#06C755;"></i> LINE</th>
                <th>สร้างเมื่อ</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="6" style="text-align:center;padding:32px;color:var(--gray-400);">กำลังโหลด...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div><!-- /content-area -->
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const API_URL = (() => {
  try { return localStorage.getItem('apiUrl') || ''; } catch(e) { return ''; }
})();

const ROLE_LABEL = { admin: 'Admin', user: 'Office', accountant: 'ฝ่ายบัญชี', executive: 'ผู้บริหาร', labor: 'แรงงาน' };

// ===== NAVIGATION =====
function showPage(page) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  const pageEl = document.getElementById('page-' + page);
  const navEl  = document.getElementById('nav-' + page);
  if (pageEl) pageEl.classList.add('active');
  if (navEl)  navEl.classList.add('active');

  const titles = { employees: 'HR — จัดการพนักงาน', users: 'ผู้ใช้งานระบบ' };
  document.getElementById('topbarTitle').textContent = titles[page] || '';

  if (page === 'users') loadUsers();
}

function goBack() {
  location.href = 'https://benzlovely12.github.io/zg-liff/app.html';
}

// ===== USERS =====
async function loadUsers() {
  const tbody = document.getElementById('usersTableBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--gray-400);">กำลังโหลด...</td></tr>';
  try {
    const res = await apiCall({ action: 'getUsers' });
    if (res.success && Array.isArray(res.data)) {
      renderUsers(res.data);
    } else {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--gray-400);">ไม่พบข้อมูล</td></tr>';
    }
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger);">โหลดไม่สำเร็จ: ' + e.message + '</td></tr>';
  }
}

function renderUsers(users) {
  const tbody = document.getElementById('usersTableBody');
  if (!users || users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--gray-400);">ยังไม่มีผู้ใช้งาน</td></tr>';
    return;
  }
  tbody.innerHTML = users.map((u, i) => `
    <tr>
      <td style="color:var(--gray-400);">${i + 1}</td>
      <td>
        <div class="user-name-cell">
          <span class="user-avatar">${(u.Name||'?').charAt(0).toUpperCase()}</span>
          <span style="font-weight:600;">${u.Name || '-'}</span>
        </div>
      </td>
      <td>${ROLE_LABEL[u.Role] || u.Role || '-'}</td>
      <td>
        <span class="badge ${u.Status === 'active' ? 'badge-active' : 'badge-inactive'}">
          ${u.Status === 'active' ? 'ใช้งาน' : 'ระงับ'}
        </span>
      </td>
      <td style="font-size:13px;color:${u.LineUserID ? '#06C755' : 'var(--gray-400)'};">
        ${u.LineUserID ? '<i class="fa-brands fa-line"></i> เชื่อมแล้ว' : '<span style="opacity:.5;">—</span>'}
      </td>
      <td style="color:var(--gray-500);font-size:13px;">${u.CreatedAt || '-'}</td>
    </tr>
  `).join('');
}

// ===== API =====
async function apiCall(params) {
  const url = API_URL || localStorage.getItem('apiUrl') || '';
  if (!url) { showToast('ยังไม่ได้ตั้งค่า API URL', 'error'); throw new Error('No API URL'); }
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(params),
    redirect: 'follow'
  });
  return res.json();
}

// ===== TOAST =====
function showToast(msg, type) {
  const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark' };
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = '<i class="fa-solid ' + (icons[type] || 'fa-info-circle') + '"></i> ' + msg;
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
</script>
</body>
</html>
